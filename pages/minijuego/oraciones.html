function obtenerPalabraLimpia(palabra) {
    let limpia = palabra.toLowerCase().trim();
    if (limpia === "." || limpia === "") return "Fin";
    if (mapeoPalabrasGlobal[limpia]) limpia = mapeoPalabrasGlobal[limpia];
    limpia = limpia.replace(/^(el|la|los|las|mi|su|sus|un|una|unos|unas)\s+/g, "").trim();
    return limpia.charAt(0).toUpperCase() + limpia.slice(1);
}

/* FUNCIÓN QUE ENVÍA LA PALABRA SELECCIONADA AL AVATAR API EN TIEMPO REAL */
function enviarTextoAIntérpreteAPI(textoPalabra) {
    const palabraLimpia = obtenerPalabraLimpia(textoPalabra);
    if (palabraLimpia === "Fin") return;

    try {
        // Buscamos el elemento interno del widget de VLibras y forzamos la traducción de la glosa
        if (window.lsvWidget && typeof window.lsvWidget.translate === 'function') {
            window.lsvWidget.translate(palabraLimpia);
        } else {
            // Fallback: Si el plugin no se ha cargado por completo, simula el evento sobre el texto
            const elementoInvis = document.createElement('div');
            elementoInvis.textContent = palabraLimpia;
            elementoInvis.setAttribute('vw-text', 'true');
            document.body.appendChild(elementoInvis);
            
            const eventoClick = new MouseEvent('click', { bubbles: true, cancelable: true });
            elementoInvis.dispatchEvent(eventoClick);
            setTimeout(() => elementoInvis.remove(), 500);
        }
    } catch (err) {
        console.warn("La API del intérprete 3D está inicializándose...", err);
    }
}

      const { data: usuario, error } = await supabase
        .from('personal_institucional')
        .select('nombre')
        .eq('cedula', cedulaInstitucional)
        .single();

      if (error || !usuario) throw new Error("Cédula no válida");
      bienvenida.textContent = `Bienvenido, ${usuario.nombre}`;
      bienvenidaMobile.textContent = `Bienvenido, ${usuario.nombre}`;
      userId = cedulaInstitucional; 
    } catch (err) {
      localStorage.removeItem("user_cedula");
      location.href = '/pages/Login/login.html';
    }
  } else {
    isInstitucional = false;
    try{
      const { data, error } = await supabase.auth.getUser();
      if(error) throw error;
      const user = data?.user;
      if(user){
        userId = user.id;
        const nombre = user.user_metadata?.full_name || user.email;
        bienvenida.textContent = `Bienvenido, ${nombre}`;
        bienvenidaMobile.textContent = `Bienvenido, ${nombre}`;
      }else{
        location.href='/pages/Login/login.html';
      }
    }catch(err){
      location.href='/pages/Login/login.html';
    }
  }
}

/* EXTRAER DESDE LA API DE ARASAAC WITH FALLBACKS */
async function buscarImagenEnArasaac(palabra) {
    let queryLimpio = palabra.toLowerCase().trim();
    if (queryLimpio === "." || queryLimpio === "") {
        return "https://static.arasaac.org/pictograms/7397/7397_300.png";
    }

    if (mapeoPalabrasGlobal[queryLimpio]) {
        queryLimpio = mapeoPalabrasGlobal[queryLimpio];
    } else {
        queryLimpio = queryLimpio
            .replace(/^(el|la|los|las|mi|su|sus|un|una|unos|unas)\s+/g, "")
            .replace(/\s+(en|con|de|a|el|la|los|las|su|sus|un|una)$/g, "")
            .trim();
    }

    if (queryLimpio === "manos") queryLimpio = "mano";
    if (queryLimpio === "dientes") queryLimpio = "diente";
    if (queryLimpio === "huevos") queryLimpio = "huevo";
    if (queryLimpio === "personas") queryLimpio = "persona";

    let urlEncontrada = await consultarAPI(queryLimpio);
    if (urlEncontrada) return urlEncontrada;

    if (queryLimpio.endsWith("e")) { 
        urlEncontrada = await consultarAPI(queryLimpio.slice(0, -1) + "ir");
        if (urlEncontrada) return urlEncontrada;
        urlEncontrada = await consultarAPI(queryLimpio.slice(0, -1) + "er");
        if (urlEncontrada) return urlEncontrada;
    } 
    else if (queryLimpio.endsWith("a")) { 
        urlEncontrada = await consultarAPI(queryLimpio + "r");
        if (urlEncontrada) return urlEncontrada;
    }

    const fragmentos = queryLimpio.split(" ");
    if (fragmentos.length > 1) {
        urlEncontrada = await consultarAPI(fragmentos[0]);
        if (urlEncontrada) return urlEncontrada;
    }

    return "https://via.placeholder.com/150?text=" + encodeURIComponent(palabra);
}

async function consultarAPI(termino) {
    try {
        const res = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${encodeURIComponent(termino)}`);
        const data = await res.json();
        if (data && data.length > 0) {
            return `https://static.arasaac.org/pictograms/${data[0]._id}/${data[0]._id}_300.png`;
        }
    } catch (e) { console.error(e); }
    return null;
}

async function generarNuevaRondaOracion() {
    pasoFraseActual = 0;
    juegoFeedbackDiv.textContent = "";
    juegoFeedbackDiv.className = "text-2xl font-bold h-8";
    juegoOpcionesDiv.innerHTML = "<p class='col-span-full py-4 text-purple-600 font-bold animate-pulse text-lg'>Buscando vocabulario estructurado en ARASAAC...</p>";

    slotSujeto.textContent = "Inicio"; slotSujeto.className = "w-full bg-white rounded-2xl border-2 border-gray-200 aspect-square flex items-center justify-center p-2 text-xs font-bold text-gray-400 shadow-inner text-center";
    slotAccion.textContent = "Acción / Verbo"; slotAccion.className = "w-full bg-white rounded-2xl border-2 border-gray-200 aspect-square flex items-center justify-center p-2 text-xs font-bold text-gray-400 shadow-inner text-center";
    slotObjeto.textContent = "Complemento"; slotObjeto.className = "w-full bg-white rounded-2xl border-2 border-gray-200 aspect-square flex items-center justify-center p-2 text-xs font-bold text-gray-400 shadow-inner text-center";

    const oracionElegida = bancoOraciones[Math.floor(Math.random() * bancoOraciones.length)];
    
    const poolFiltrado = bancoOraciones.filter(o => o.b1 !== oracionElegida.b1);
    const distractor1 = poolFiltrado[Math.floor(Math.random() * poolFiltrado.length)];
    const distractor2 = poolFiltrado[(Math.floor(Math.random() * poolFiltrado.length)) % poolFiltrado.length];

    const [imgB1, imgB2, imgB3, imgDB1, imgDB2, imgDB3] = await Promise.all([
        buscarImagenEnArasaac(oracionElegida.b1),
        buscarImagenEnArasaac(oracionElegida.b2),
        buscarImagenEnArasaac(oracionElegida.b3),
        buscarImagenEnArasaac(distractor1.b1),
        buscarImagenEnArasaac(distractor2.b2),
        buscarImagenEnArasaac(distractor1.b3)
    ]);

    let complementoString = oracionElegida.b3 === "." ? "" : " " + oracionElegida.b3;
    datosRondaActual = {
        bloque1: { palabra: oracionElegida.b1, img: imgB1 },
        bloque2: { palabra: oracionElegida.b2, img: imgB2 },
        bloque3: { palabra: oracionElegida.b3, img: imgB3 },
        fraseCompleta: `${oracionElegida.b1} ${oracionElegida.b2}${complementoString}.`
    };

    labelBloque1.textContent = obtenerPalabraLimpia(oracionElegida.b1).toUpperCase();
    labelBloque2.textContent = obtenerPalabraLimpia(oracionElegida.b2).toUpperCase();
    labelBloque3.textContent = obtenerPalabraLimpia(oracionElegida.b3).toUpperCase();
    juegoPreguntaSpan.textContent = datosRondaActual.fraseCompleta.toUpperCase();

    // El avatar 3D gesticula la primera palabra clave al iniciar
    enviarTextoAIntérpreteAPI(oracionElegida.b1);

    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(`Vamos a formar la frase: ${datosRondaActual.fraseCompleta}`));

    const opcionesMezcladas = [
        { palabra: oracionElegida.b1, img: imgB1, paso: 0, tipo: "b1" },
        { palabra: oracionElegida.b2, img: imgB2, paso: 1, tipo: "b2" },
        { palabra: oracionElegida.b3, img: imgB3, paso: 2, tipo: "b3" },
        { palabra: distractor1.b1, img: imgDB1, paso: 0, tipo: "b1" },
        { palabra: distractor2.b2, img: imgDB2, paso: 1, tipo: "b2" },
        { palabra: distractor1.b3, img: imgDB3, paso: 2, tipo: "b3" }
    ].sort(() => 0.5 - Math.random());

    juegoOpcionesDiv.innerHTML = "";
    const claseBordeCard = isInstitucional ? 'border-blue-200' : 'border-purple-200';

    opcionesMezcladas.forEach(item => {
        const textoMostrarTarjeta = obtenerPalabraLimpia(item.palabra);

        const card = document.createElement('div');
        card.className = `bg-white rounded-3xl shadow-xl hover:scale-105 border-4 ${claseBordeCard} p-3 cursor-pointer transition-all flex flex-col items-center justify-center w-full aspect-square max-w-[140px] mx-auto text-center`;
        card.innerHTML = `
            <img src="${item.img}" data-palabra="${item.palabra}" class="w-[70%] h-[70%] object-contain pictograma-img">
            <span class="text-[12px] font-black text-gray-600 mt-1 leading-tight break-words max-w-full">${textoMostrarTarjeta}</span>
        `;
        
        card.onclick = () => verificarRespuestaPaso(item, card);
        juegoOpcionesDiv.appendChild(card);
    });
}

function verificarRespuestaPaso(itemSeleccionado, elementoCard) {
    if (!juegoActivo) return;
    speechSynthesis.cancel();

    let esCorrecto = false;
    const palabraLimpiaMostrar = obtenerPalabraLimpia(itemSeleccionado.palabra);

    if (pasoFraseActual === 0 && itemSeleccionado.palabra === datosRondaActual.bloque1.palabra && itemSeleccionado.paso === 0) {
        esCorrecto = true;
        slotSujeto.innerHTML = `<div class="flex flex-col items-center justify-center p-1"><img src="${itemSeleccionado.img}" class="w-[70%] h-[70%] object-contain animate-fade-in"><span class="text-[11px] font-bold text-gray-700 mt-0.5">${palabraLimpiaMostrar}</span></div>`;
        slotSujeto.className = "w-full bg-white rounded-2xl border-4 border-green-500 aspect-square flex items-center justify-center shadow-md";
        
        // Ejecutar seña de la siguiente palabra en la API
        enviarTextoAIntérpreteAPI(datosRondaActual.bloque2.palabra);
    } else if (pasoFraseActual === 1 && itemSeleccionado.palabra === datosRondaActual.bloque2.palabra && itemSeleccionado.paso === 1) {
        esCorrecto = true;
        slotAccion.innerHTML = `<div class="flex flex-col items-center justify-center p-1"><img src="${itemSeleccionado.img}" class="w-[70%] h-[70%] object-contain animate-fade-in"><span class="text-[11px] font-bold text-gray-700 mt-0.5">${palabraLimpiaMostrar}</span></div>`;
        slotAccion.className = "w-full bg-white rounded-2xl border-4 border-green-500 aspect-square flex items-center justify-center shadow-md";
        
        // Ejecutar seña del complemento final en la API
        enviarTextoAIntérpreteAPI(datosRondaActual.bloque3.palabra);
    } else if (pasoFraseActual === 2 && itemSeleccionado.palabra === datosRondaActual.bloque3.palabra && itemSeleccionado.paso === 2) {
        esCorrecto = true;
        slotObjeto.innerHTML = `<div class="flex flex-col items-center justify-center p-1"><img src="${itemSeleccionado.img}" class="w-[70%] h-[70%] object-contain animate-fade-in"><span class="text-[11px] font-bold text-gray-700 mt-0.5">${palabraLimpiaMostrar}</span></div>`;
        slotObjeto.className = "w-full bg-white rounded-2xl border-4 border-green-500 aspect-square flex items-center justify-center shadow-md";
    }

    if (esCorrecto) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(palabraLimpiaMostrar));
        elementoCard.classList.add('opacity-30', 'pointer-events-none');
        
        ultimoElemento = null; 
        pasoFraseActual++;

        if (pasoFraseActual === 3) {
            aciertos++; rachaActual++;
            txtAciertos.textContent = aciertos; txtRacha.textContent = rachaActual;

            elementoCard.classList.add('animacion-correcto');
            juegoFeedbackDiv.textContent = "🌟 ¡Excelente! Oración completada 🎉";
            juegoFeedbackDiv.className = "text-2xl font-bold mb-6 text-green-500 animate-fade-in";
            
            setTimeout(() => {
                speechSynthesis.speak(new SpeechSynthesisUtterance(datosRondaActual.fraseCompleta));
                // El avatar interpreta la frase entera de corrido al ganar la ronda
                enviarTextoAIntérpreteAPI(datosRondaActual.fraseCompleta);
            }, 600);

            juegoActivo = false;
            setTimeout(() => {
                juegoActivo = true; generarNuevaRondaOracion();
            }, 4000);
        }
    } else {
        rachaActual = 0; txtRacha.textContent = rachaActual;
        elementoCard.classList.add('animacion-incorrecto');
        juegoFeedbackDiv.textContent = "💪 Inténtalo otra vez, ¡sigue el orden de la frase!";
        juegoFeedbackDiv.className = "text-xl font-bold mb-6 text-orange-500 animate-fade-in";
        speechSynthesis.speak(new SpeechSynthesisUtterance("Inténtalo otra vez"));

        setTimeout(() => { elementoCard.classList.remove('animacion-incorrecto'); }, 600);
    }
}

/* MEDIAPIPE FACE MESH SETUP */
const canvasElement = document.getElementById("canvasCam");
const canvasCtx = canvasElement.getContext("2d");
const cursorVirtual = document.getElementById("cursorVirtual");

let rostroX = window.innerWidth / 2; let rostroY = window.innerHeight / 2;
let suavizadoX = rostroX; let suavizadoY = rostroY;
let ultimoElemento = null; let hoverInicio = 0;
const TIEMPO_HOVER = 1200; const TIEMPO_COOLDOWN = 1500; 
const cooldownMap = new Map();

const faceMesh = new FaceMesh({
  locateFile: (file)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
faceMesh.onResults(onResults);

const camera = new Camera(videoCam, {
  onFrame: async () => { await faceMesh.send({ image: videoCam }); },
  width: 640, height: 480
});
camera.start();

function onResults(results){
  canvasElement.width = videoCam.videoWidth; canvasElement.height = videoCam.videoHeight;
  canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if(results.multiFaceLandmarks.length > 0 && punteroActivo){
    const landmarks = results.multiFaceLandmarks[0];
    const nose = landmarks[1];
    const x = nose.x * canvasElement.width; const y = nose.y * canvasElement.height;

    canvasCtx.strokeStyle = isInstitucional ? "#3b82f6" : "#00ff00"; canvasCtx.lineWidth=4;
    canvasCtx.strokeRect(x-40, y-40, 80, 80);

    rostroX = window.innerWidth - (nose.x * window.innerWidth); rostroY = nose.y * window.innerHeight;
    suavizadoX += (rostroX - suavizadoX) * 0.15; suavizadoY += (rostroY - suavizadoY) * 0.15;

    cursorVirtual.style.left = `${suavizadoX}px`; cursorVirtual.style.top = `${suavizadoY}px`;
    if(isInstitucional) {
      cursorVirtual.classList.remove("bg-green-500"); cursorVirtual.classList.add("bg-blue-500");
    } else {
      cursorVirtual.classList.remove("bg-blue-500"); cursorVirtual.classList.add("bg-green-500");
    }
    detectarHover();
  }
  canvasCtx.restore();
}

function detectarHover(){
  const elemento = document.elementFromPoint(suavizadoX, suavizadoY);
  if(!elemento) return;
  const esPictograma = elemento.tagName==="IMG" && elemento.closest("#juego-opciones");

  if(!esPictograma){ ultimoElemento=null; return; }
  if(elemento===ultimoElemento){
    if(Date.now() - hoverInicio > TIEMPO_HOVER){
      ejecutarClick(elemento); hoverInicio = Date.now() + 999999;
    }
  }else{
    ultimoElemento = elemento; hoverInicio = Date.now();
  }
}

function ejecutarClick(elemento){
  const ahora = Date.now(); const ultimoClick = cooldownMap.get(elemento) || 0;
  if(ahora - ultimoClick < TIEMPO_COOLDOWN) return;
  cooldownMap.set(elemento, ahora);
  elemento.style.transform="scale(1.25)"; elemento.style.transition="0.2s";
  setTimeout(()=>{ elemento.style.transform=""; },300);
  elemento.click();
}

inicializarAutenticacionYEstilos();
