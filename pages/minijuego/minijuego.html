<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PictoVoz - Minijuego</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MEDIAPIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <!-- ESTILOS ADICIONALES PARA ANIMACIONES DEL JUEGO -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .animacion-correcto {
            animation: pulseGreen 0.5s ease-in-out;
        }
        .animacion-incorrecto {
            animation: shakeRed 0.5s ease-in-out;
        }
        @keyframes pulseGreen {
            0%, 100% { transform: scale(1); border-color: #86efac; }
            50% { transform: scale(1.1); border-color: #22c55e; background-color: #f0fdf4; }
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); border-color: #fca5a5; }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>

<body id="body-context" class="font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300">

<!-- NAVBAR RESPONSIVE (Control dinámico por IDs) -->
<nav id="navbar-context" class="bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300">
  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <div class="flex items-center gap-3 text-white font-bold text-xl">
      <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md"/>
      <span id="lblBrandName" class="text-xl md:text-2xl">PictoVoz</span>
    </div>

    <!-- BOTON MENU MOBILE -->
    <button id="menu-btn" class="md:hidden text-white text-4xl font-bold transition hover:scale-110">
      ☰
    </button>

    <!-- MENU DESKTOP -->
    <div class="hidden md:flex items-center gap-4 text-white">
      <span id="bienvenida" class="font-black text-sm md:text-base tracking-wide">Cargando perfil...</span>
      <a href="/pages/menu/teclado-menu.html" class="hover:bg-white/20 px-4 py-2 rounded-xl transition font-bold">Menú</a>
      <button id="cerrar-sesion-btn" class="bg-red-400 hover:bg-red-500 px-4 py-2 rounded-2xl font-bold shadow-md transition">
        Cerrar Sesión
      </button>
    </div>

  </div>

  <!-- MENU MOBILE -->
  <div id="mobile-menu" class="hidden md:hidden flex-col mt-5 gap-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 text-white animate-fade-in">
    <span id="bienvenida-mobile" class="font-bold text-center text-lg">Cargando perfil...</span>
    <a href="/pages/menu/teclado-menu.html" class="bg-white/20 hover:bg-white/30 py-3 rounded-2xl font-bold transition text-center">Menú</a>
    <button id="cerrar-sesion-btn-mobile" class="bg-red-400 hover:bg-red-500 py-3 rounded-2xl font-bold shadow-md transition">
      Cerrar Sesión
    </button>
  </div>
</nav>

<!-- SECCIÓN PRINCIPAL: TECLADO -->
<section class="mt-6 px-2 md:px-4">
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-700">MINIJUEGO DE PICTOGRAMAS</h2>

    <!-- CONTROLES (Bordes dinámicos controlados por ID) -->
    <div class="mt-6 flex flex-col sm:flex-row flex-wrap justify-center items-center gap-3">
        <input id="input-busqueda" placeholder="Ej: Manzana" class="px-4 py-3 rounded-2xl border-2 border-green-300 w-full sm:w-64 text-lg outline-none focus:ring-4 focus:ring-green-300 transition-all duration-300"/>
        <button id="btn-agregar" class="bg-blue-400 hover:bg-blue-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto shadow-md transition">🔍 Buscar</button>
        <button id="btn-editar" class="bg-yellow-400 hover:bg-yellow-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto shadow-md transition">✏️ Editar</button>
        <button id="btn-eliminar" class="bg-red-400 hover:bg-red-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto shadow-md transition">🗑️ Eliminar</button>
        <button id="btn-guardar" class="bg-purple-500 hover:bg-purple-600 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto shadow-md transition">💾 Guardar</button>
        <button id="btn-puntero" class="bg-gray-600 hover:bg-gray-700 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto shadow-md transition">🖱️ Desactivar Puntero</button>
    </div>

    <!-- MENSAJE TOAST -->
    <div id="mensaje-modo" class="mt-4 hidden text-white font-bold px-4 py-2 rounded-xl shadow-md max-w-md mx-auto"></div>

    <!-- RESULTADOS -->
    <div id="resultados-busqueda" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 max-w-4xl mx-auto mt-6"></div>

    <!-- TECLADO -->
    <div id="contenedor-pictogramas" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-9 gap-4 md:gap-6 mt-10 px-2"></div>
</section>

<!-- SECCIÓN DEL MINIJUEGO INTERACTIVO -->
<section id="seccion-juego" class="mt-16 mx-auto max-w-4xl px-4 pb-16">
    <div id="card-juego" class="bg-white rounded-3xl shadow-2xl p-6 border-4 border-purple-300 transition-all duration-300">
        <h2 id="title-juego" class="text-xl sm:text-3xl font-extrabold text-purple-600 mb-2">🎮 ¡A Jugar y Aprender!</h2>
        <p class="text-gray-600 mb-6 font-semibold">Practica el uso del puntero seleccionando el pictograma correcto</p>

        <!-- PANTALLA DE INICIO -->
        <div id="juego-inicio" class="py-6">
            <button id="btn-iniciar-juego" class="bg-gradient-to-r from-purple-500 to-indigo-500 hover:scale-105 text-white font-black text-xl sm:text-2xl px-12 py-5 rounded-3xl shadow-lg transition-all">
                🚀 ¡Empezar Juego!
            </button>
        </div>

        <!-- PANTALLA PRINCIPAL DEL JUEGO (OCULTA AL INICIO) -->
        <div id="juego-pantalla" class="hidden animate-fade-in">
            <!-- PREGUNTA -->
            <div id="bg-pregunta" class="bg-purple-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300">
                <h3 class="text-xl md:text-3xl font-black text-purple-800">
                    ¿Cuál es el pictograma de: <span id="juego-pregunta" class="text-blue-600 underline">...</span>?
                </h3>
            </div>

            <!-- FEEDBACK EMOCIONAL -->
            <div id="juego-feedback" class="text-2xl font-bold mb-6 h-8 transition-all duration-300"></div>

            <!-- CONTENEDOR DE LAS 3 OPCIONES -->
            <div id="juego-opciones" class="grid grid-cols-1 sm:grid-cols-3 gap-6 justify-center items-center max-w-2xl mx-auto"></div>

            <!-- MARCADOR DE PUNTOS -->
            <div class="mt-8 flex justify-center gap-8 text-xl font-bold text-gray-700">
                <p>✅ Aciertos: <span id="puntos-aciertos" class="text-green-500">0</span></p>
                <p>⭐ Racha: <span id="puntos-racha" class="text-purple-500">0</span></p>
            </div>
        </div>
    </div>
</section>

<!-- MODAL ELIMINAR -->
<div id="modal-eliminar" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50 p-4">
    <div class="bg-white rounded-3xl p-6 shadow-2xl text-center w-full max-w-sm">
        <h3 class="text-xl font-bold mb-3">🗑️ ¿Eliminar pictograma?</h3>
        <p id="texto-modal" class="mb-5 text-gray-600"></p>
        <div class="flex justify-center gap-3">
            <button id="cancelar-eliminar" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-xl font-bold">Cancelar</button>
            <button id="confirmar-eliminar" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-bold">Eliminar</button>
        </div>
    </div>
</div>

<!-- CAMARA RESPONSIVE -->
<div class="fixed top-20 left-2 md:left-4 z-40">
  <div class="relative">
    <video id="videoCam" class="rounded-2xl border-4 border-green-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300" autoplay muted playsinline></video>
    <canvas id="canvasCam" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
  </div>
</div>

<!-- CURSOR VIRTUAL -->
<div id="cursorVirtual" class="fixed w-4 h-4 md:w-6 md:h-6 bg-green-500 rounded-full border-4 border-white shadow-xl z-[9999] pointer-events-none transition-all duration-75"></div>

<!-- LÓGICA JAVASCRIPT INTEGRADA -->
<script type="module">
import { supabase } from '/pages/Login/supabase.js';

/* ELEMENTOS DEL CONTEXTO DINÁMICO */
const bodyContext = document.getElementById('body-context');
const navbarContext = document.getElementById('navbar-context');
const lblBrandName = document.getElementById('lblBrandName');
const inputBusqueda = document.getElementById('input-busqueda');
const cardJuego = document.getElementById('card-juego');
const titleJuego = document.getElementById('title-juego');
const bgPregunta = document.getElementById('bg-pregunta');
const videoCam = document.getElementById('videoCam');

/* ELEMENTOS DOM GENERALES */
const bienvenida = document.getElementById('bienvenida');
const bienvenidaMobile = document.getElementById('bienvenida-mobile');
const cerrarBtn = document.getElementById('cerrar-sesion-btn');
const cerrarBtnMobile = document.getElementById('cerrar-sesion-btn-mobile');
const menuBtn = document.getElementById('menu-btn');
const mobileMenu = document.getElementById('mobile-menu');

const btnAgregar = document.getElementById('btn-agregar');
const btnEditar = document.getElementById('btn-editar');
const btnEliminar = document.getElementById('btn-eliminar');
const btnGuardar = document.getElementById('btn-guardar');
const btnPuntero = document.getElementById('btn-puntero');

const contenedor = document.getElementById('contenedor-pictogramas');
const resultadosDiv = document.getElementById('resultados-busqueda');
const mensajeModo = document.getElementById('mensaje-modo');

const modal = document.getElementById('modal-eliminar');
const textoModal = document.getElementById('texto-modal');
const confirmarEliminar = document.getElementById('confirmar-eliminar');
const cancelarEliminar = document.getElementById('cancelar-eliminar');

/* ELEMENTOS DEL JUEGO */
const juegoInicioDiv = document.getElementById('juego-inicio');
const juegoPantallaDiv = document.getElementById('juego-pantalla');
const btnIniciarJuego = document.getElementById('btn-iniciar-juego');
const juegoPreguntaSpan = document.getElementById('juego-pregunta');
const juegoOpcionesDiv = document.getElementById('juego-opciones');
const juegoFeedbackDiv = document.getElementById('juego-feedback');
const txtAciertos = document.getElementById('puntos-aciertos');
const txtRacha = document.getElementById('puntos-racha');

/* VARIABLES DE ESTADO */
let userId = null;
let modoActual = null;
let pictogramas = [];
let pictoAEliminar = null;
let punteroActivo = true;
let isInstitucional = false;

let juegoActivo = false;
let opcionCorrecta = null;
let aciertos = 0;
let rachaActual = 0;

/* PICTOS POR DEFECTO */
const pictogramasDefecto = [
  { palabra:"Hola", img:"/images/pictogramas/hola.png", fijo:true },
  { palabra:"Quiero Comer", img:"/images/pictogramas/comer.png", fijo:true },
  { palabra:"Beber", img:"/images/pictogramas/beber.png", fijo:true }
];

/* MENSAJES TOAST */
function mostrarMensajeModo(texto, color){
  mensajeModo.textContent = texto;
  mensajeModo.className = `mt-4 text-white font-bold px-4 py-2 rounded-xl shadow-md max-w-md mx-auto ${color}`;
  mensajeModo.classList.remove('hidden');
  setTimeout(()=>{
    mensajeModo.classList.add('hidden');
  },2500);
}

/* CONTROL DE USUARIO & AUTENTICACIÓN HÍBRIDA */
async function inicializarAutenticacionYEstilos() {
  const cedulaInstitucional = localStorage.getItem("user_cedula");

  if (cedulaInstitucional) {
    // --- ADAPTACIÓN MODO INSTITUCIONAL ---
    isInstitucional = true;
    bodyContext.className = "font-sans bg-gradient-to-b from-blue-100 to-indigo-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300";
    navbarContext.className = "bg-gradient-to-r from-blue-600 to-blue-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
    lblBrandName.textContent = "PictoVoz Institucional";
    inputBusqueda.className = "px-4 py-3 rounded-2xl border-2 border-blue-300 w-full sm:w-64 text-lg outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-300";
    cardJuego.className = "bg-white rounded-3xl shadow-2xl p-6 border-4 border-blue-300 transition-all duration-300";
    titleJuego.className = "text-xl sm:text-3xl font-extrabold text-blue-600 mb-2";
    bgPregunta.className = "bg-blue-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300";
    videoCam.className = "rounded-2xl border-4 border-blue-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300";

    try {
      // Consultar tabla relacional en Postgres vía cédula
      const { data: usuario, error } = await supabase
        .from('personal_institucional')
        .select('nombre')
        .eq('cedula', cedulaInstitucional)
        .single();

      if (error || !usuario) throw new Error("Cédula no válida en el sistema");

      bienvenida.textContent = `Bienvenido, ${usuario.nombre}`;
      bienvenidaMobile.textContent = `Bienvenido, ${usuario.nombre}`;
      
      // En entorno institucional usamos una clave unificada o dummy para simular el scope del usuario en pictogramas
      userId = cedulaInstitucional; 
      await cargar();

    } catch (err) {
      console.error('Error institucional:', err.message);
      localStorage.removeItem("user_cedula");
      location.href = '/pages/Login/login.html';
    }

  } else {
    // --- ADAPTACIÓN MODO PÚBLICO (GOOGLE) ---
    isInstitucional = false;
    bodyContext.className = "font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300";
    navbarContext.className = "bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
    lblBrandName.textContent = "PictoVoz";
    inputBusqueda.className = "px-4 py-3 rounded-2xl border-2 border-green-300 w-full sm:w-64 text-lg outline-none focus:ring-4 focus:ring-green-300 transition-all duration-300";
    cardJuego.className = "bg-white rounded-3xl shadow-2xl p-6 border-4 border-purple-300 transition-all duration-300";
    titleJuego.className = "text-xl sm:text-3xl font-extrabold text-purple-600 mb-2";
    bgPregunta.className = "bg-purple-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300";
    videoCam.className = "rounded-2xl border-4 border-green-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300";

    try{
      const { data, error } = await supabase.auth.getUser();
      if(error) throw error;
      const user = data?.user;

      if(user){
        userId = user.id;
        const nombre = user.user_metadata?.full_name || user.email;
        bienvenida.textContent = `Bienvenido, ${nombre}`;
        bienvenidaMobile.textContent = `Bienvenido, ${nombre}`;
        await cargar();
      }else{
        location.href='/pages/Login/login.html';
      }
    }catch(err){
      console.error(err);
      location.href='/pages/Login/login.html';
    }
  }
}

/* SUPABASE - OPERACIONES BASE DE DATOS */
async function cargar(){
  // Si es institucional, filtramos opcionalmente por cédula como identificador de perfil
  const { data } = await supabase
    .from('pictogramas_usuario')
    .select('*')
    .eq('user_id', userId);

  pictogramas = [
    ...pictogramasDefecto,
    ...(data || [])
  ];
  renderizarPictogramas();
}

async function guardarPictograma(p){
  await supabase.from('pictogramas_usuario').insert([
    { user_id:userId, palabra:p.palabra, img:p.img }
  ]);
}

async function eliminarPictogramaDB(p){
  await supabase.from('pictogramas_usuario').delete().eq('user_id', userId).eq('palabra', p.palabra);
}

/* RENDERIZADO DEL TECLADO */
function renderizarPictogramas(){
  contenedor.innerHTML='';
  const claseBorde = isInstitucional ? 'border-blue-200' : 'border-green-200';
  const claseBordeInput = isInstitucional ? 'border-blue-300 font-medium' : 'border-green-300';
  
  pictogramas.forEach((picto,index)=>{
    const cont=document.createElement('div');
    cont.className='flex flex-col items-center';

    const div=document.createElement('div');
    div.className=`bg-white rounded-3xl shadow-lg hover:scale-110 transition p-2 md:p-4 cursor-pointer w-[85px] h-[85px] sm:w-[95px] sm:h-[95px] md:w-[110px] md:h-[110px] flex items-center justify-center border-4 ${claseBorde}`;
    div.innerHTML=`<img src="${picto.img}" class="w-[60px] h-[60px] sm:w-[70px] sm:h-[70px] md:w-[80px] md:h-[80px] object-contain pictograma-img">`;

    if(!modoActual){
      div.onclick=()=>{
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(picto.palabra));
      };
    }

    if(modoActual==='eliminar' && !picto.fijo){
      div.onclick=()=>{
        pictoAEliminar={picto,index};
        textoModal.textContent=`¿Eliminar "${picto.palabra}"?`;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      };
    }

    cont.appendChild(div);

    if(modoActual==='editar' && !picto.fijo){
      const input=document.createElement('input');
      input.value=picto.palabra;
      input.className=`mt-2 px-2 py-1 rounded-lg border-2 ${claseBordeInput} text-center w-[80px] md:w-[100px] text-sm`;
      input.onchange=async ()=>{
        pictogramas[index].palabra=input.value;
        await supabase.from('pictogramas_usuario').update({ palabra:input.value }).eq('user_id',userId).eq('img',picto.img);
      };
      cont.appendChild(input);
    }else{
      const span=document.createElement('span');
      span.className='mt-2 font-bold text-sm md:text-base text-gray-700';
      span.textContent=picto.palabra;
      cont.appendChild(span);
    }
    contenedor.appendChild(cont);
  });
}

/* LOGOUT UNIFICADO */
const cerrarSesion = async () => {
  localStorage.removeItem("user_cedula");
  await supabase.auth.signOut();
  location.href='/pages/Login/login.html';
};
cerrarBtn.onclick = cerrarSesion;
cerrarBtnMobile.onclick = cerrarSesion;

menuBtn.onclick = ()=>{
  mobileMenu.classList.toggle('hidden');
  mobileMenu.classList.toggle('flex');
};

/* ACCIONES DE INTERFAZ DEL TECLADO */
btnEditar.onclick=()=>{
  modoActual='editar';
  renderizarPictogramas();
  mostrarMensajeModo("✏️ Estás en modo editar", "bg-yellow-500");
};

btnEliminar.onclick=()=>{
  modoActual='eliminar';
  renderizarPictogramas();
  mostrarMensajeModo("🗑️ Estás en modo eliminar", "bg-red-500");
};

btnGuardar.onclick=()=>{
  modoActual=null;
  renderizarPictogramas();
  mostrarMensajeModo("✅ Cambios guardados", "bg-green-500");
};

btnPuntero.onclick = ()=>{
  punteroActivo = !punteroActivo;
  if(punteroActivo){
    cursorVirtual.style.display = "block";
    videoElement.parentElement.style.display = "block";
    btnPuntero.innerHTML = "🖱️ Desactivar Puntero";
    mostrarMensajeModo("✅ Puntero activado", "bg-green-500");
  }else{
    cursorVirtual.style.display = "none";
    videoElement.parentElement.style.display = "none";
    btnPuntero.innerHTML = "🖱️ Activar Puntero";
    mostrarMensajeModo("⛔ Puntero desactivado", "bg-red-500");
  }
};

cancelarEliminar.onclick=()=> modal.classList.add('hidden');

confirmarEliminar.onclick=async ()=>{
  if(pictoAEliminar){
    const {picto,index}=pictoAEliminar;
    await eliminarPictogramaDB(picto);
    pictogramas.splice(index,1);
    renderizarPictogramas();
  }
  modal.classList.add('hidden');
};

/* BUSCADOR ARASAAC */
btnAgregar.onclick=async ()=>{
  mostrarMensajeModo("🔍 Estás en modo buscar", "bg-blue-500");
  const termino=inputBusqueda.value.trim();
  if(!termino) return;

  const res=await fetch(`https://api.arasaac.org/api/pictograms/es/search/${encodeURIComponent(termino)}`);
  const data=await res.json();
  resultadosDiv.innerHTML='';

  data.slice(0,20).forEach(p=>{
    const url=`https://static.arasaac.org/pictograms/${p._id}/${p._id}_300.png`;
    const img=document.createElement('img');
    img.src=url;
    img.className='w-full max-w-[100px] rounded-2xl cursor-pointer hover:scale-110 transition mx-auto';
    img.onclick=async ()=>{
      const nuevo={ palabra:termino, img:url, fijo:false };
      pictogramas.push(nuevo);
      await guardarPictograma(nuevo);
      modoActual=null;
      renderizarPictogramas();
      resultadosDiv.innerHTML='';
      inputBusqueda.value='';
    };
    resultadosDiv.appendChild(img);
  });
};

/* =========================================
   LÓGICA OPERATIVA DEL MINIJUEGO
========================================= */
btnIniciarJuego.onclick = () => {
    if (pictogramas.length < 3) {
        alert("Por favor, guarda al menos 3 pictogramas en tu cuenta para poder jugar.");
        return;
    }
    juegoInicioDiv.classList.add('hidden');
    juegoPantallaDiv.classList.remove('hidden');
    juegoActivo = true;
    generarNuevaRonda();
};

function generarNuevaRonda() {
    juegoFeedbackDiv.textContent = "";
    juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8";
    juegoOpcionesDiv.innerHTML = "";

    const poolBarajado = [...pictogramas].sort(() => 0.5 - Math.random());
    const seleccionadas = poolBarajado.slice(0, 3);

    opcionCorrecta = seleccionadas[Math.floor(Math.random() * seleccionadas.length)];
    juegoPreguntaSpan.textContent = opcionCorrecta.palabra.toUpperCase();

    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(`¿Cuál es el pictograma de: ${opcionCorrecta.palabra}?`));

    const claseBordeCard = isInstitucional ? 'border-blue-200' : 'border-purple-200';

    seleccionadas.forEach(picto => {
        const card = document.createElement('div');
        card.className = `bg-white rounded-3xl shadow-xl hover:scale-105 border-4 ${claseBordeCard} p-4 cursor-pointer transition-all flex flex-col items-center justify-center w-full aspect-square max-w-[160px] mx-auto`;
        card.innerHTML = `<img src="${picto.img}" data-palabra="${picto.palabra}" class="w-[85%] h-[85%] object-contain pictograma-img">`;
        
        card.onclick = () => verificarRespuesta(picto.palabra, card);
        juegoOpcionesDiv.appendChild(card);
    });
}

function verificarRespuesta(palabraSeleccionada, elementoCard) {
    if (!juegoActivo) return;
    speechSynthesis.cancel();

    if (palabraSeleccionada === opcionCorrecta.palabra) {
        aciertos++;
        rachaActual++;
        txtAciertos.textContent = aciertos;
        txtRacha.textContent = rachaActual;

        elementoCard.classList.add('animacion-correcto');
        juegoFeedbackDiv.textContent = "🌟 ¡Excelente! ¡Lo lograste! 🎉";
        juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8 text-green-500 animate-fade-in";
        speechSynthesis.speak(new SpeechSynthesisUtterance("¡Excelente! ¡Lo lograste!"));

        juegoActivo = false;
        setTimeout(() => {
            juegoActivo = true;
            generarNuevaRonda();
        }, 2000);
    } else {
        rachaActual = 0;
        txtRacha.textContent = rachaActual;

        elementoCard.classList.add('animacion-incorrecto');
        juegoFeedbackDiv.textContent = "💪 Inténtalo otra vez, ¡tú puedes!";
        juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8 text-orange-500 animate-fade-in";
        speechSynthesis.speak(new SpeechSynthesisUtterance("Inténtalo otra vez, ¡tú puedes!"));

        setTimeout(() => {
            elementoCard.classList.remove('animacion-incorrecto');
        }, 600);
    }
}

/* =========================================
   CÁMARA + ROSTRO (MEDIAPIPE INTERACTION)
========================================= */
const videoElement = document.getElementById("videoCam");
const canvasElement = document.getElementById("canvasCam");
const canvasCtx = canvasElement.getContext("2d");
const cursorVirtual = document.getElementById("cursorVirtual");

let rostroX = window.innerWidth / 2;
let rostroY = window.innerHeight / 2;
let suavizadoX = rostroX;
let suavizadoY = rostroY;

let ultimoElemento = null;
let hoverInicio = 0;
const TIEMPO_HOVER = 1200;
const TIEMPO_COOLDOWN = 3000;
const cooldownMap = new Map();

const faceMesh = new FaceMesh({
  locateFile: (file)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await faceMesh.send({ image: videoElement });
  },
  width: 640,
  height: 480
});
camera.start();

function onResults(results){
  canvasElement.width = videoElement.videoWidth;
  canvasElement.height = videoElement.videoHeight;

  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if(results.multiFaceLandmarks.length > 0 && punteroActivo){
    const landmarks = results.multiFaceLandmarks[0];
    const nose = landmarks[1];

    const x = nose.x * canvasElement.width;
    const y = nose.y * canvasElement.height;

    // Adaptar color del recuadro del tracker de la cámara según el entorno
    canvasCtx.strokeStyle = isInstitucional ? "#3b82f6" : "#00ff00";
    canvasCtx.lineWidth=4;
    canvasCtx.strokeRect(x-40, y-40, 80, 80);

    rostroX = window.innerWidth - (nose.x * window.innerWidth);
    rostroY = nose.y * window.innerHeight;

    suavizadoX += (rostroX - suavizadoX) * 0.15;
    suavizadoY += (rostroY - suavizadoY) * 0.15;

    cursorVirtual.style.left = `${suavizadoX}px`;
    cursorVirtual.style.top = `${suavizadoY}px`;

    // Cambiar el color del cursor virtual si es institucional
    if(isInstitucional) {
      cursorVirtual.classList.remove("bg-green-500");
      cursorVirtual.classList.add("bg-blue-500");
    } else {
      cursorVirtual.classList.remove("bg-blue-500");
      cursorVirtual.classList.add("bg-green-500");
    }

    detectarHover();
  }
  canvasCtx.restore();
}

/* HOVER INTELIGENTE */
function detectarHover(){
  const elemento = document.elementFromPoint(suavizadoX, suavizadoY);
  if(!elemento) return;

  const esPictograma = elemento.tagName==="IMG" && 
                       (elemento.closest("#contenedor-pictogramas") || elemento.closest("#juego-opciones"));

  if(!esPictograma){
    ultimoElemento=null;
    return;
  }

  if(elemento===ultimoElemento){
    if(Date.now() - hoverInicio > TIEMPO_HOVER){
      ejecutarClick(elemento);
      hoverInicio = Date.now() + 999999;
    }
  }else{
    ultimoElemento = elemento;
    hoverInicio = Date.now();
  }
}

function ejecutarClick(elemento){
  const ahora = Date.now();
  const ultimoClick = cooldownMap.get(elemento) || 0;

  if(ahora - ultimoClick < TIEMPO_COOLDOWN){
    return;
  }

  cooldownMap.set(elemento, ahora);

  elemento.style.transform="scale(1.25)";
  elemento.style.transition="0.2s";
  setTimeout(()=>{ elemento.style.transform=""; },300);

  elemento.click();
}

// Inicializar el guardrail de autenticación y los contextos gráficos
inicializarAutenticacionYEstilos();

</script>
