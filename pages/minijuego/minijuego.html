<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PictoVoz - Minijuego de Selección</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .animacion-correcto {
            animation: pulseGreen 0.5s ease-in-out;
        }
        .animacion-incorrecto {
            animation: shakeRed 0.5s ease-in-out;
        }
        @keyframes pulseGreen {
            0%, 100% { transform: scale(1); border-color: #86efac; }
            50% { transform: scale(1.1); border-color: #22c55e; background-color: #f0fdf4; }
        }
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); border-color: #fca5a5; }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
    </style>
</head>

<body id="body-context" class="font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300">

<nav id="navbar-context" class="bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300">
  <div class="flex justify-between items-center">

    <div class="flex items-center gap-3 text-white font-bold text-xl">
      <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md"/>
      <span id="lblBrandName" class="text-xl md:text-2xl">PictoVoz</span>
    </div>

    <button id="menu-btn" class="md:hidden text-white text-4xl font-bold transition hover:scale-110">
      ☰
    </button>

    <div class="hidden md:flex items-center gap-4 text-white">
      <span id="bienvenida" class="font-black text-sm md:text-base tracking-wide">Cargando perfil...</span>
      <a href="/pages/menu/minijuego-menu.html" class="hover:bg-white/20 px-4 py-2 rounded-xl transition font-bold">Menú</a>
      <button id="cerrar-sesion-btn" class="bg-red-400 hover:bg-red-500 px-4 py-2 rounded-2xl font-bold shadow-md transition">
        Cerrar Sesión
      </button>
    </div>

  </div>

  <div id="mobile-menu" class="hidden md:hidden flex-col mt-5 gap-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 text-white animate-fade-in">
    <span id="bienvenida-mobile" class="font-bold text-center text-lg">Cargando perfil...</span>
    <a href="/pages/menu/minijuego-menu.html" class="bg-white/20 hover:bg-white/30 py-3 rounded-2xl font-bold transition text-center">Menú</a>
    <button id="cerrar-sesion-btn-mobile" class="bg-red-400 hover:bg-red-500 py-3 rounded-2xl font-bold shadow-md transition">
      Cerrar Sesión
    </button>
  </div>
</nav>

<section class="mt-6 px-4 flex justify-center">
    <button id="btn-puntero" class="bg-gray-600 hover:bg-gray-700 px-6 py-3 rounded-2xl text-white font-bold shadow-md transition-all flex items-center gap-2 text-lg">
        🖱️ <span>Desactivar Puntero</span>
    </button>
</section>

<section id="seccion-juego" class="mt-8 mx-auto max-w-4xl px-4 pb-16">
    <div id="card-juego" class="bg-white rounded-3xl shadow-2xl p-6 border-4 border-purple-300 transition-all duration-300">
        <h2 id="title-juego" class="text-xl sm:text-3xl font-extrabold text-purple-600 mb-2">🎮 ¡A Jugar y Aprender!</h2>
        <p class="text-gray-600 mb-6 font-semibold">Practica el uso del puntero seleccionando el pictograma correcto</p>

        <div id="juego-inicio" class="py-6">
            <button id="btn-iniciar-juego" class="bg-gradient-to-r from-purple-500 to-indigo-500 hover:scale-105 text-white font-black text-xl sm:text-2xl px-12 py-5 rounded-3xl shadow-lg transition-all">
                🚀 ¡Empezar Juego!
            </button>
        </div>

        <div id="juego-pantalla" class="hidden animate-fade-in">
            <div id="bg-pregunta" class="bg-purple-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300">
                <h3 class="text-xl md:text-3xl font-black text-purple-800">
                    ¿Cuál es el pictograma de: <span id="juego-pregunta" class="text-blue-600 underline">...</span>?
                </h3>
            </div>

            <div id="juego-feedback" class="text-2xl font-bold mb-6 h-8 transition-all duration-300"></div>

            <div id="juego-opciones" class="grid grid-cols-1 sm:grid-cols-3 gap-6 justify-center items-center max-w-2xl mx-auto"></div>

            <div class="mt-8 flex justify-center gap-8 text-xl font-bold text-gray-700">
                <p>✅ Aciertos: <span id="puntos-aciertos" class="text-green-500">0</span></p>
                <p>⭐ Racha: <span id="puntos-racha" class="text-purple-500">0</span></p>
            </div>
        </div>
    </div>
</section>

<div class="fixed top-20 left-2 md:left-4 z-40">
  <div class="relative">
    <video id="videoCam" class="rounded-2xl border-4 border-green-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300" autoplay muted playsinline></video>
    <canvas id="canvasCam" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
  </div>
</div>

<div id="cursorVirtual" class="fixed w-4 h-4 md:w-6 md:h-6 bg-green-500 rounded-full border-4 border-white shadow-xl z-[9999] pointer-events-none transition-all duration-75"></div>

<script type="module">
import { supabase } from '/pages/Login/supabase.js';

/* ELEMENTOS DEL CONTEXTO DINÁMICO */
const bodyContext = document.getElementById('body-context');
const navbarContext = document.getElementById('navbar-context');
const lblBrandName = document.getElementById('lblBrandName');
const cardJuego = document.getElementById('card-juego');
const titleJuego = document.getElementById('title-juego');
const bgPregunta = document.getElementById('bg-pregunta');
const videoCam = document.getElementById('videoCam');

/* ELEMENTOS DOM GENERALES */
const bienvenida = document.getElementById('bienvenida');
const bienvenidaMobile = document.getElementById('bienvenida-mobile');
const cerrarBtn = document.getElementById('cerrar-sesion-btn');
const cerrarBtnMobile = document.getElementById('cerrar-sesion-btn-mobile');
const menuBtn = document.getElementById('menu-btn');
const mobileMenu = document.getElementById('mobile-menu');
const btnPuntero = document.getElementById('btn-puntero');

/* ELEMENTOS DEL JUEGO */
const juegoInicioDiv = document.getElementById('juego-inicio');
const juegoPantallaDiv = document.getElementById('juego-pantalla');
const btnIniciarJuego = document.getElementById('btn-iniciar-juego');
const juegoPreguntaSpan = document.getElementById('juego-pregunta');
const juegoOpcionesDiv = document.getElementById('juego-opciones');
const juegoFeedbackDiv = document.getElementById('juego-feedback');
const txtAciertos = document.getElementById('puntos-aciertos');
const txtRacha = document.getElementById('puntos-racha');

/* VARIABLES DE ESTADO */
let userId = null;
let punteroActivo = true;
let isInstitucional = false;

let juegoActivo = false;
let opcionCorrecta = null;
let aciertos = 0;
let rachaActual = 0;

/* 🌟 BANCO DE PALABRAS EXCLUSIVO PARA GENERAR RONDAS DESDE LA API */
const bolsaPalabrasJuego = [
  "Manzana", "Plátano", "Perro", "Gato", "Pelota", "Libro", "Agua", 
  "Leche", "Carro", "Casa", "Sol", "Luna", "Árbol", "Mesa", "Silla",
  "Niño", "Niña", "Juguete", "Cuaderno", "Pizarra", "Sopa", "Pescado"
];

/* CONTROL DE USUARIO & AUTENTICACIÓN HÍBRIDA */
async function inicializarAutenticacionYEstilos() {
  const cedulaInstitucional = localStorage.getItem("user_cedula");

  if (cedulaInstitucional) {
    isInstitucional = true;
    bodyContext.className = "font-sans bg-gradient-to-b from-blue-100 to-indigo-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300";
    navbarContext.className = "bg-gradient-to-r from-blue-600 to-blue-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
    lblBrandName.textContent = "PictoVoz Institucional";
    cardJuego.className = "bg-white rounded-3xl shadow-2xl p-6 border-4 border-blue-300 transition-all duration-300";
    titleJuego.className = "text-xl sm:text-3xl font-extrabold text-blue-600 mb-2";
    bgPregunta.className = "bg-blue-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300";
    videoCam.className = "rounded-2xl border-4 border-blue-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300";

    try {
      const { data: usuario, error } = await supabase
        .from('personal_institucional')
        .select('nombre')
        .eq('cedula', cedulaInstitucional)
        .single();

      if (error || !usuario) throw new Error("Cédula no válida");

      bienvenida.textContent = `Bienvenido, ${usuario.nombre}`;
      bienvenidaMobile.textContent = `Bienvenido, ${usuario.nombre}`;
      userId = cedulaInstitucional; 

    } catch (err) {
      localStorage.removeItem("user_cedula");
      location.href = '/pages/Login/login.html';
    }

  } else {
    isInstitucional = false;
    bodyContext.className = "font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center overflow-x-hidden min-h-screen transition-colors duration-300";
    navbarContext.className = "bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
    lblBrandName.textContent = "PictoVoz";
    cardJuego.className = "bg-white rounded-3xl shadow-2xl p-6 border-4 border-purple-300 transition-all duration-300";
    titleJuego.className = "text-xl sm:text-3xl font-extrabold text-purple-600 mb-2";
    bgPregunta.className = "bg-purple-100 rounded-2xl py-4 px-6 mb-8 inline-block shadow-sm transition-all duration-300";
    videoCam.className = "rounded-2xl border-4 border-green-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black transition-all duration-300";

    try{
      const { data, error } = await supabase.auth.getUser();
      if(error) throw error;
      const user = data?.user;

      if(user){
        userId = user.id;
        const nombre = user.user_metadata?.full_name || user.email;
        bienvenida.textContent = `Bienvenido, ${nombre}`;
        bienvenidaMobile.textContent = `Bienvenido, ${nombre}`;
      }else{
        location.href='/pages/Login/login.html';
      }
    }catch(err){
      location.href='/pages/Login/login.html';
    }
  }
}

/* LOGOUT UNIFICADO */
const cerrarSesion = async () => {
  localStorage.removeItem("user_cedula");
  await supabase.auth.signOut();
  location.href='/pages/Login/login.html';
};
cerrarBtn.onclick = cerrarSesion;
cerrarBtnMobile.onclick = cerrarSesion;

menuBtn.onclick = ()=>{
  mobileMenu.classList.toggle('hidden');
  mobileMenu.classList.toggle('flex');
};

/* OPERATIVA DEL PUNTERO */
btnPuntero.onclick = () => {
  punteroActivo = !punteroActivo;
  if(punteroActivo){
    cursorVirtual.style.display = "block";
    videoCam.parentElement.style.display = "block";
    btnPuntero.querySelector('span').textContent = "Desactivar Puntero";
    btnPuntero.className = "bg-gray-600 hover:bg-gray-700 px-6 py-3 rounded-2xl text-white font-bold shadow-md transition-all flex items-center gap-2 text-lg";
  }else{
    cursorVirtual.style.display = "none";
    videoCam.parentElement.style.display = "none";
    btnPuntero.querySelector('span').textContent = "Activar Puntero";
    btnPuntero.className = "bg-green-500 hover:bg-green-600 px-6 py-3 rounded-2xl text-white font-bold shadow-md transition-all flex items-center gap-2 text-lg";
  }
};

/* 🌟 FUNCIÓN PARA EXTRAER IMÁGENES AL VUELO DESDE LA API DE ARASAAC */
async function buscarImagenEnArasaac(palabra) {
    try {
        const res = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${encodeURIComponent(palabra.toLowerCase())}`);
        const data = await res.json();
        if (data && data.length > 0) {
            return `https://static.arasaac.org/pictograms/${data[0]._id}/${data[0]._id}_300.png`;
        }
    } catch (e) { console.error("Error buscando en API:", e); }
    return "https://via.placeholder.com/150?text=Error";
}

/* =========================================
   🎮 LÓGICA OPERATIVA DEL MINIJUEGO DE SELECCIÓN DIRECTA
========================================= */
btnIniciarJuego.onclick = () => {
    juegoInicioDiv.classList.add('hidden');
    juegoPantallaDiv.classList.remove('hidden');
    juegoActivo = true;
    generarNuevaRonda();
};

async function generarNuevaRonda() {
    juegoFeedbackDiv.textContent = "";
    juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8";
    juegoOpcionesDiv.innerHTML = "<p class='col-span-full py-4 text-purple-600 font-bold animate-pulse text-lg'>Buscando opciones en ARASAAC...</p>";

    // 1. Elegir 3 palabras al azar del pool independiente sin repetición
    const poolRonda = [...bolsaPalabrasJuego].sort(() => 0.5 - Math.random()).slice(0, 3);
    
    // 2. Traer las 3 imágenes correspondientes en paralelo desde la API externa
    const [img1, img2, img3] = await Promise.all([
        buscarImagenEnArasaac(poolRonda[0]),
        buscarImagenEnArasaac(poolRonda[1]),
        buscarImagenEnArasaac(poolRonda[2])
    ]);

    const seleccionadas = [
        { palabra: poolRonda[0], img: img1 },
        { palabra: poolRonda[1], img: img2 },
        { palabra: poolRonda[2], img: img3 }
    ];

    // Elegir cuál de las tres será la correcta de la ronda
    opcionCorrecta = seleccionadas[Math.floor(Math.random() * seleccionadas.length)];
    juegoPreguntaSpan.textContent = opcionCorrecta.palabra.toUpperCase();

    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(`¿Cuál es el pictograma de: ${opcionCorrecta.palabra}?`));

    // Renderizar opciones en pantalla
    juegoOpcionesDiv.innerHTML = "";
    const claseBordeCard = isInstitucional ? 'border-blue-200' : 'border-purple-200';

    seleccionadas.forEach(picto => {
        const card = document.createElement('div');
        card.className = `bg-white rounded-3xl shadow-xl hover:scale-105 border-4 ${claseBordeCard} p-4 cursor-pointer transition-all flex flex-col items-center justify-center w-full aspect-square max-w-[160px] mx-auto`;
        card.innerHTML = `<img src="${picto.img}" data-palabra="${picto.palabra}" class="w-[85%] h-[85%] object-contain pictograma-img">`;
        
        card.onclick = () => verificarRespuesta(picto.palabra, card);
        juegoOpcionesDiv.appendChild(card);
    });
}

function verificarRespuesta(palabraSeleccionada, elementoCard) {
    if (!juegoActivo) return;
    speechSynthesis.cancel();

    if (palabraSeleccionada === opcionCorrecta.palabra) {
        aciertos++;
        rachaActual++;
        txtAciertos.textContent = aciertos;
        txtRacha.textContent = rachaActual;

        elementoCard.classList.add('animacion-correcto');
        juegoFeedbackDiv.textContent = "🌟 ¡Excelente! ¡Lo lograste! 🎉";
        juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8 text-green-500 animate-fade-in";
        speechSynthesis.speak(new SpeechSynthesisUtterance("¡Excelente! ¡Lo lograste!"));

        // 🌟 CORRECCIÓN PUNTERO CONGELADO: Forzar el reseteo inmediato del hover tracker
        ultimoElemento = null;

        juegoActivo = false;
        setTimeout(() => {
            juegoActivo = true;
            generarNuevaRonda();
        }, 2000);
    } else {
        rachaActual = 0;
        txtRacha.textContent = rachaActual;

        elementoCard.classList.add('animacion-incorrecto');
        juegoFeedbackDiv.textContent = "💪 Inténtalo otra vez, ¡tú puedes!";
        juegoFeedbackDiv.className = "text-2xl font-bold mb-6 h-8 text-orange-500 animate-fade-in";
        speechSynthesis.speak(new SpeechSynthesisUtterance("Inténtalo otra vez, ¡tú puedes!"));

        setTimeout(() => {
            elementoCard.classList.remove('animacion-incorrecto');
        }, 600);
    }
}

/* =========================================
   CÁMARA + ROSTRO (MEDIAPIPE INTERACTION)
========================================= */
const canvasElement = document.getElementById("canvasCam");
const canvasCtx = canvasElement.getContext("2d");

let rostroX = window.innerWidth / 2;
let rostroY = window.innerHeight / 2;
let suavizadoX = rostroX;
let suavizadoY = rostroY;

let ultimoElemento = null;
let hoverInicio = 0;
const TIEMPO_HOVER = 1200;
const TIEMPO_COOLDOWN = 3000;
const cooldownMap = new Map();

const faceMesh = new FaceMesh({
  locateFile: (file)=> `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
faceMesh.onResults(onResults);

const camera = new Camera(videoCam, {
  onFrame: async () => {
    await faceMesh.send({ image: videoCam });
  },
  width: 640,
  height: 480
});
camera.start();

function onResults(results){
  canvasElement.width = videoCam.videoWidth;
  canvasElement.height = videoCam.videoHeight;

  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if(results.multiFaceLandmarks.length > 0 && punteroActivo){
    const landmarks = results.multiFaceLandmarks[0];
    const nose = landmarks[1];

    const x = nose.x * canvasElement.width;
    const y = nose.y * canvasElement.height;

    canvasCtx.strokeStyle = isInstitucional ? "#3b82f6" : "#00ff00";
    canvasCtx.lineWidth=4;
    canvasCtx.strokeRect(x-40, y-40, 80, 80);

    rostroX = window.innerWidth - (nose.x * window.innerWidth);
    rostroY = nose.y * window.innerHeight;

    suavizadoX += (rostroX - suavizadoX) * 0.15;
    suavizadoY += (rostroY - suavizadoY) * 0.15;

    cursorVirtual.style.left = `${suavizadoX}px`;
    cursorVirtual.style.top = `${suavizadoY}px`;

    if(isInstitucional) {
      cursorVirtual.classList.remove("bg-green-500");
      cursorVirtual.classList.add("bg-blue-500");
    } else {
      cursorVirtual.classList.remove("bg-blue-500");
      cursorVirtual.classList.add("bg-green-500");
    }

    detectarHover();
  }
  canvasCtx.restore();
}

function detectarHover(){
  const elemento = document.elementFromPoint(suavizadoX, suavizadoY);
  if(!elemento) return;

  const esPictograma = elemento.tagName==="IMG" && elemento.closest("#juego-opciones");

  if(!esPictograma){
    ultimoElemento=null;
    return;
  }

  if(elemento===ultimoElemento){
    if(Date.now() - hoverInicio > TIEMPO_HOVER){
      ejecutarClick(elemento);
      hoverInicio = Date.now() + 999999;
    }
  }else{
    ultimoElemento = elemento;
    hoverInicio = Date.now();
  }
}

function ejecutarClick(elemento){
  const ahora = Date.now();
  const ultimoClick = cooldownMap.get(elemento) || 0;

  if(ahora - ultimoClick < TIEMPO_COOLDOWN){
    return;
  }

  cooldownMap.set(elemento, ahora);

  elemento.style.transform="scale(1.25)";
  elemento.style.transition="0.2s";
  setTimeout(()=>{ elemento.style.transform=""; },300);

  elemento.click();
}

inicializarAutenticacionYEstilos();

</script>
</body>
</html>
