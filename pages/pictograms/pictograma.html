<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PictoVoz</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe para Tracking Facial -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="font-sans text-center overflow-x-hidden">

    <!-- NAVBAR RESPONSIVE -->
    <nav class="bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50">
        <div class="flex justify-between items-center">
            
            <!-- LOGO -->
            <div class="flex items-center gap-3 text-white font-bold text-xl">
                <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md"/>
                <span class="text-xl md:text-2xl">PictoVoz</span>
            </div>

            <!-- BOTON MENU MOBILE -->
            <button id="menu-btn" class="md:hidden text-white text-4xl font-bold transition hover:scale-110">
                ☰
            </button>

            <!-- MENU DESKTOP -->
            <div class="hidden md:flex items-center gap-4 text-white">
                <span id="bienvenida" class="font-semibold"></span>
                <a href="/pages/menu/teclado-menu.html" class="hover:bg-white/20 px-4 py-2 rounded-xl transition font-bold">Menu</a>
                <button id="cerrar-sesion-btn" class="bg-red-400 hover:bg-red-500 px-4 py-2 rounded-2xl font-bold shadow-md transition">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <!-- MENU MOBILE -->
        <div id="mobile-menu" class="hidden md:hidden flex-col mt-5 gap-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 text-white animate-fade-in">
            <span id="bienvenida-mobile" class="font-semibold text-center text-lg"></span>
            <a href="/pages/menu/teclado-menu.html" class="bg-white/20 hover:bg-white/30 py-3 rounded-2xl font-bold transition">Menu</a>
            <button id="cerrar-sesion-btn-mobile" class="bg-red-400 hover:bg-red-500 py-3 rounded-2xl font-bold shadow-md transition">
                Cerrar Sesión
            </button>
        </div>
    </nav>

    <!-- SECCIÓN PRINCIPAL -->
    <section class="mt-6 px-2 md:px-4">
        <h2 class="text-2xl md:text-3xl font-extrabold text-gray-700">TECLADO DE PICTOGRAMAS</h2>

        <!-- CONTROLES Y ACCIONES -->
        <div class="mt-6 flex flex-col sm:flex-row flex-wrap justify-center items-center gap-3">
            <input id="input-busqueda" placeholder="Ej: Manzana" class="px-4 py-3 rounded-2xl border-2 border-green-300 w-full sm:w-64 text-lg outline-none focus:ring-4 focus:ring-green-300"/>
            <button id="btn-agregar" class="bg-blue-400 hover:bg-blue-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto">🔍 Buscar</button>
            <button id="btn-editar" class="bg-yellow-400 hover:bg-yellow-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto">✏️ Editar</button>
            <button id="btn-eliminar" class="bg-red-400 hover:bg-red-500 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto">🗑️ Eliminar</button>
            <button id="btn-guardar" class="bg-purple-500 hover:bg-purple-600 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto">💾 Guardar</button>
            <button id="btn-puntero" class="bg-gray-600 hover:bg-gray-700 px-5 py-2 rounded-2xl text-white font-bold w-full sm:w-auto">🖱️ Desactivar Puntero</button>
        </div>

        <!-- NOTIFICACIONES DE MODO -->
        <div id="mensaje-modo" class="mt-4 hidden text-white font-bold px-4 py-2 rounded-xl shadow-md max-w-md mx-auto"></div>

        <!-- GALERÍA DE RESULTADOS API -->
        <div id="resultados-busqueda" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 max-w-4xl mx-auto mt-6"></div>

        <!-- CONTENEDOR PRINCIPAL DE LIKES/PICTOGRAMAS -->
        <div id="contenedor-pictogramas" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-9 gap-4 md:gap-6 mt-10 px-2"></div>
    </section>

    <!-- MODAL DE CONFIRMACIÓN PARA ELIMINAR -->
    <div id="modal-eliminar" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl text-center w-full max-w-sm">
            <h3 class="text-xl font-bold mb-3">🗑️ ¿Eliminar pictograma?</h3>
            <p id="texto-modal" class="mb-5 text-gray-600"></p>
            <div class="flex justify-center gap-3">
                <button id="cancelar-eliminar" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-xl font-bold">Cancelar</button>
                <button id="confirmar-eliminar" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl font-bold">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- FEED DE CÁMARA FLOTANTE -->
    <div class="fixed top-20 left-2 md:left-4 z-40">
        <div class="relative">
            <video id="videoCam" class="rounded-2xl border-4 border-green-400 shadow-2xl w-28 h-24 sm:w-36 sm:h-28 md:w-44 md:h-32 object-cover bg-black" autoplay muted playsinline></video>
            <canvas id="canvasCam" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
        </div>
    </div>

    <!-- CURSOR VIRTUAL (SE MUEVE CON LA NARIZ) -->
    <div id="cursorVirtual" class="fixed w-4 h-4 md:w-6 md:h-6 bg-green-500 rounded-full border-4 border-white shadow-xl z-[9999] pointer-events-none transition-all duration-75"></div>

    <!-- Scripts de la Aplicación -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
