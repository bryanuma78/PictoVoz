<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PictoVoz - Teclado LS</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body id="body-context" class="font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center min-h-screen overflow-x-hidden transition-colors duration-300">

<!-- NAVBAR RESPONSIVE (Control dinámico por IDs) -->
<nav id="navbar-context" class="bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300">
  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <div class="flex items-center gap-3 text-white font-bold text-xl">
      <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md"/>
      <span id="lblBrandName" class="text-xl md:text-2xl">PictoVoz</span>
    </div>

    <!-- BOTON MENU MOBILE -->
    <button id="menu-btn" class="md:hidden text-white text-4xl font-bold transition hover:scale-110">
      ☰
    </button>

    <!-- MENU DESKTOP -->
    <div class="hidden md:flex items-center gap-4 text-white">
      <span id="bienvenida" class="font-black text-sm md:text-base tracking-wide">Cargando perfil...</span>
      <a href="/pages/menu/teclado-menu.html" class="hover:bg-white/20 px-4 py-2 rounded-xl transition font-bold">Menú</a>
      <button id="cerrar-sesion-btn" class="bg-red-400 hover:bg-red-500 px-4 py-2 rounded-2xl font-bold shadow-md transition">
        Cerrar Sesión
      </button>
    </div>

  </div>

  <!-- MENU MOBILE -->
  <div id="mobile-menu" class="hidden md:hidden flex-col mt-5 gap-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 text-white animate-fade-in">
    <span id="bienvenida-mobile" class="font-bold text-center text-lg">Cargando perfil...</span>
    <a href="/pages/menu/teclado-menu.html" class="bg-white/20 hover:bg-white/30 py-3 rounded-2xl font-bold transition text-center">Menú</a>
    <button id="cerrar-sesion-btn-mobile" class="bg-red-400 hover:bg-red-500 py-3 rounded-2xl font-bold shadow-md transition">
      Cerrar Sesión
    </button>
  </div>
</nav>

<!-- ===== SECCIÓN TECLADO LS ===== -->
<section class="mt-6 px-2 md:px-4 max-w-6xl mx-auto pb-12">
    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-700">TECLADO DE LENGUA DE SEÑAS</h2>
    <p class="text-gray-600 mt-2 font-semibold">Haz clic en las letras para formar tu palabra o frase:</p>

    <!-- 🟦 CAMPO DE FRASE (TEXTAREA) -->
    <div id="wrapper-frase" class="mt-6 max-w-2xl mx-auto flex gap-3 bg-white p-3 rounded-3xl border-4 border-green-200 shadow-lg items-center transition-all duration-300">
      <textarea id="campo-frase" placeholder="Tu frase aparecerá aquí..." class="w-full text-lg font-medium px-3 py-2 outline-none resize-none overflow-hidden h-12 text-gray-700" readonly></textarea>
      <button id="btn-voz" title="Reproducir 🔊" class="bg-blue-400 hover:bg-blue-500 text-white p-4 text-xl rounded-2xl transition shadow-md shrink-0">🔊</button>
    </div>

    <!-- 🟩 TECLADO + BOTONES LATERALES -->
    <div class="mt-8 flex flex-col lg:flex-row gap-6 justify-center items-start px-2">
      
      <!-- Contenedor Dinámico de Teclas -->
      <div id="contenedor-teclado-box" class="contenedor-teclado flex flex-col gap-3 w-full lg:max-w-4xl bg-white/40 backdrop-blur-sm p-4 rounded-3xl border-2 border-green-300 shadow-md transition-all duration-300">
        <!-- Generado por JS -->
      </div>

      <!-- Botones laterales / Controles -->
      <div class="flex flex-row lg:flex-col gap-3 w-full lg:w-48 justify-center flex-wrap shrink-0">
        <button id="btn-espacio" class="bg-blue-400 hover:bg-blue-500 px-5 py-4 rounded-2xl text-white font-bold shadow-md transition flex-1 lg:flex-none">Espacio ␣</button>
        <button id="btn-borrar-letra" class="bg-yellow-400 hover:bg-yellow-500 px-5 py-4 rounded-2xl text-white font-bold shadow-md transition flex-1 lg:flex-none">← Borrar Letra</button>
        <button id="btn-borrar" class="bg-red-400 hover:bg-red-500 px-5 py-4 rounded-2xl text-white font-bold shadow-md transition flex-1 lg:flex-none">🗑️ Borrar Todo</button>
      </div>

    </div>
</section>

<!-- ===== SCRIPT ===== -->
<script type="module">
    import { supabase } from '/pages/Login/supabase.js';

    /* ELEMENTOS DEL CONTEXTO DINÁMICO */
    const bodyContext = document.getElementById('body-context');
    const navbarContext = document.getElementById('navbar-context');
    const lblBrandName = document.getElementById('lblBrandName');
    const wrapperFrase = document.getElementById('wrapper-frase');
    const contenedorTecladoBox = document.getElementById('contenedor-teclado-box');

    /* ELEMENTOS DOM GENERALES */
    const bienvenida = document.getElementById('bienvenida');
    const bienvenidaMobile = document.getElementById('bienvenida-mobile');
    const cerrarBtn = document.getElementById('cerrar-sesion-btn');
    const cerrarBtnMobile = document.getElementById('cerrar-sesion-btn-mobile');
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    /* AUTENTICACIÓN HÍBRIDA E INTELIGENTE */
    async function inicializarAutenticacionYEstilos() {
      const cedulaInstitucional = localStorage.getItem("user_cedula");

      if (cedulaInstitucional) {
        // --- ADAPTACIÓN VISUAL MODO INSTITUCIONAL ---
        bodyContext.className = "font-sans bg-gradient-to-b from-blue-100 to-indigo-100 text-center min-h-screen overflow-x-hidden";
        navbarContext.className = "bg-gradient-to-r from-blue-600 to-blue-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
        lblBrandName.textContent = "PictoVoz Institucional";
        wrapperFrase.className = "mt-6 max-w-2xl mx-auto flex gap-3 bg-white p-3 rounded-3xl border-4 border-blue-200 shadow-lg items-center transition-all duration-300";
        contenedorTecladoBox.className = "contenedor-teclado flex flex-col gap-3 w-full lg:max-w-4xl bg-white/40 backdrop-blur-sm p-4 rounded-3xl border-2 border-blue-300 shadow-md transition-all duration-300";

        try {
          // Consultar los datos directamente en PostgreSQL usando la cédula
          const { data: usuario, error } = await supabase
            .from('personal_institucional')
            .select('nombre')
            .eq('cedula', cedulaInstitucional)
            .single();

          if (error || !usuario) throw new Error("Cédula no válida en la base de datos");

          bienvenida.textContent = `Bienvenido, ${usuario.nombre}`;
          bienvenidaMobile.textContent = `Bienvenido, ${usuario.nombre}`;

        } catch (err) {
          console.error('Error institucional:', err.message);
          localStorage.removeItem("user_cedula");
          window.location.href = '/pages/Login/login.html';
        }

      } else {
        // --- ADAPTACIÓN VISUAL MODO PÚBLICO (GOOGLE) ---
        bodyContext.className = "font-sans bg-gradient-to-b from-green-100 to-blue-100 text-center min-h-screen overflow-x-hidden";
        navbarContext.className = "bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50 transition-all duration-300";
        lblBrandName.textContent = "PictoVoz";

        try {
          const { data, error } = await supabase.auth.getUser();
          if (error) throw error;
          const user = data?.user;
          
          if (user) {
            const nombre = user.user_metadata?.full_name || user.email;
            bienvenida.textContent = `Bienvenido, ${nombre}`;
            bienvenidaMobile.textContent = `Bienvenido, ${nombre}`;
          } else {
            window.location.href = '/pages/Login/login.html';
          }
        } catch (err) {
          console.error('Error de autenticación pública:', err.message);
          window.location.href = '/pages/Login/login.html';
        }
      }
      
      // Generar el teclado interactivo después de resolver los estilos base
      generarTeclado(cedulaInstitucional ? 'border-blue-200' : 'border-green-200');
    }

    // Menú Hamburguesa Móvil
    menuBtn.onclick = () => {
      mobileMenu.classList.toggle('hidden');
      mobileMenu.classList.toggle('flex');
    };

    // Logout Unificado
    const cerrarSesion = async () => {
      localStorage.removeItem("user_cedula");
      await supabase.auth.signOut();
      window.location.href = '/pages/Login/login.html';
    };
    cerrarBtn.onclick = cerrarSesion;
    cerrarBtnMobile.onclick = cerrarSesion;

    /* ===== TECLADO DE SEÑAS QWERTY DINÁMICO ===== */
    const filas = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L','Ñ'],
      ['Z','X','C','V','B','N','M']
    ];

    const campoFrase = document.getElementById('campo-frase');
    const btnVoz = document.getElementById('btn-voz');
    const btnBorrar = document.getElementById('btn-borrar');
    const btnBorrarLetra = document.getElementById('btn-borrar-letra');
    const btnEspacio = document.getElementById('btn-espacio');

    // Función modificada para inyectar la clase de borde correcta dinámicamente
    function generarTeclado(claseBorde) {
      contenedorTecladoBox.innerHTML = ""; // Limpiar contenedor
      
      filas.forEach(fila => {
        const filaDiv = document.createElement('div');
        filaDiv.className = 'flex justify-center gap-1 sm:gap-2 w-full';
        
        fila.forEach(letra => {
          const div = document.createElement('div');
          div.className = `bg-white rounded-xl sm:rounded-2xl border-2 ${claseBorde} shadow hover:scale-110 transition p-1 sm:p-2 cursor-pointer flex flex-col items-center justify-between w-[9%] aspect-[3/4] max-w-[80px] min-w-[32px]`;
          
          div.innerHTML = `
            <img src="/images/LS/${letra}.jpg" alt="${letra}" class="w-full object-contain rounded-lg flex-1" onerror="this.src='https://placehold.co/100?text=${letra}'" />
            <span class="font-black text-xs sm:text-base text-gray-700 mt-1 block">${letra}</span>
          `;
          
          div.addEventListener('click', () => {
            campoFrase.value += letra;
            ajustarAltura(campoFrase);
          });
          filaDiv.appendChild(div);
        });
        contenedorTecladoBox.appendChild(filaDiv);
      });
    }

    // 🔊 Reproducir con voz (TTS)
    btnVoz.addEventListener('click', () => {
      const texto = campoFrase.value.trim();
      if (!texto) return;
      speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(texto);
      speech.lang = 'es-ES';
      speech.rate = 1;
      window.speechSynthesis.speak(speech);
    });

    // 🟦 Espacio
    btnEspacio.addEventListener('click', () => {
      campoFrase.value += ' ';
      ajustarAltura(campoFrase);
    });

    // ⬅️ Borrar última letra
    btnBorrarLetra.addEventListener('click', () => {
      campoFrase.value = campoFrase.value.slice(0, -1);
      ajustarAltura(campoFrase);
    });

    // 🗑️ Borrar texto completo
    btnBorrar.addEventListener('click', () => {
      campoFrase.value = '';
      ajustarAltura(campoFrase);
    });

    function ajustarAltura(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    // Arrancar el flujo reactivo
    inicializarAutenticacionYEstilos();
</script>

</body>
</html>
