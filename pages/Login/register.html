<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | PictoVoz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { supabase } from '/pages/Login/supabase.js';

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("registerForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nombre = form.nombre.value.trim();
        const correo = form.correo.value.trim();
        const contraseña = form.contraseña.value;

        const { error } = await supabase.auth.signUp({
          email: correo,
          password: contraseña,
          options: {
            data: { full_name: nombre },
          },
        });

        if (error) {
          alert("⚠️ " + error.message);
        } else {
          alert("✅ Cuenta creada. Revisa tu correo para confirmar.");
          window.location.href = "/pages/Login/login.html";
        }
      });
    });
  </script>
</head>

<body class="font-sans bg-gradient-to-b from-green-100 to-blue-100 min-h-screen flex flex-col">

<!-- ===== NAVBAR ===== -->
<nav class="flex justify-between items-center bg-gradient-to-r from-green-500 to-green-400 px-6 py-4 shadow-lg rounded-b-3xl">
  
  <div class="flex items-center gap-3 text-white font-bold text-xl">
    <img src="/images/pictovoz.png"
      class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-md"/>
    <span>PictoVoz</span>
  </div>

  <!-- MENU DESKTOP -->
  <div class="hidden md:flex gap-6 text-white font-semibold">
    <a href="/index.html" class="hover:underline">Inicio</a>
    <a href="/pages/Login/login.html" class="hover:underline">Iniciar Sesión</a>
    <a href="/pages/Login/reset.html" class="hover:underline">Recuperar</a>
    <a href="#" class="hover:underline">Ayuda</a>
  </div>

  <!-- BOTÓN MOBILE -->
  <button id="menuBtn" class="md:hidden text-white text-2xl">☰</button>
</nav>

<!-- MENU MOBILE -->
<div id="mobileMenu"
class="hidden flex-col bg-green-500 text-white font-semibold text-center py-4 space-y-3 md:hidden">

  <a href="/index.html">Inicio</a>
  <a href="/pages/Login/login.html">Iniciar Sesión</a>
  <a href="/pages/Login/reset.html">Recuperar</a>
  <a href="#">Ayuda</a>
</div>

<!-- ===== FORMULARIO ===== -->
<main class="flex flex-1 items-center justify-center px-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-gray-700 mb-4">
      📝 Crear Cuenta
    </h2>

    <!-- MENSAJE -->
    <div class="bg-yellow-100 border border-yellow-300 text-gray-700 p-3 rounded-xl text-sm mb-5 shadow-sm">
      Usa un <strong>correo real</strong> (ej: Gmail) para recibir el correo de verificación.
    </div>

    <form id="registerForm" class="space-y-4">

      <input type="text" name="nombre" placeholder="Nombre completo" required
      class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"/>

      <input type="email" name="correo" placeholder="Correo electrónico" required
      class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"/>

      <input type="password" name="contraseña" placeholder="Contraseña" required
      class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"/>

      <button type="submit"
      class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold transition">
        Registrarse
      </button>

    </form>

    <p class="mt-5 text-sm text-gray-600">
      ¿Ya tienes cuenta?
      <a href="/pages/Login/login.html" class="text-green-600 font-semibold hover:underline">
        Inicia sesión
      </a>
    </p>

  </div>

</main>

<!-- SCRIPT MENU -->
<script>
  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>

</body>
</html>
