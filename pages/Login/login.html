<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | PictoVoz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { supabase } from '/pages/Login/supabase.js';
    
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      const googleBtn = document.getElementById("googleLogin");

      // 🔹 Login email
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const correo = form.correo.value.trim();
        const contraseña = form.contraseña.value;

        const { data, error } = await supabase.auth.signInWithPassword({
          email: correo,
          password: contraseña,
        });

        if (error) {
          alert("⚠️ " + error.message);
        } else {
          alert("✅ Bienvenido a PictoVoz");
          window.location.href = "/pages/menu/teclado-menu.html";
        }
      });

      // 🔹 Login Google
      googleBtn.addEventListener("click", async () => {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/pages/menu/teclado-menu.html'
          }
        });

        if (error) {
          alert("⚠️ Error con Google");
        }
      });
    });
  </script>
</head>

<body class="font-sans bg-gradient-to-b from-green-100 to-blue-100 min-h-screen flex flex-col">

<!-- ===== NAVBAR ===== -->
<nav class="flex justify-between items-center bg-gradient-to-r from-green-500 to-green-400 px-6 py-4 shadow-lg rounded-b-3xl">
  
  <div class="flex items-center gap-3 text-white font-bold text-xl">
    <img src="/images/pictovoz.png"
      class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-md"/>
    <span>PictoVoz</span>
  </div>

  <!-- MENU DESKTOP -->
  <div class="hidden md:flex gap-6 text-white font-semibold">
    <a href="/index.html" class="hover:underline">Inicio</a>
    <a href="/pages/Login/register.html" class="hover:underline">Registrarse</a>
    <a href="/pages/Login/reset.html" class="hover:underline">Recuperar</a>
    <a href="#" class="hover:underline">Ayuda</a>
  </div>

  <!-- BOTÓN MOBILE -->
  <button id="menuBtn" class="md:hidden text-white text-2xl">☰</button>
</nav>

<!-- MENU MOBILE -->
<div id="mobileMenu"
class="hidden flex-col bg-green-500 text-white font-semibold text-center py-4 space-y-3 md:hidden">

  <a href="/index.html">Inicio</a>
  <a href="/pages/Login/register.html">Registrarse</a>
  <a href="/pages/Login/reset.html">Recuperar</a>
  <a href="#">Ayuda</a>
</div>

<!-- ===== LOGIN ===== -->
<main class="flex flex-1 items-center justify-center px-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-gray-700 mb-6">
      🔐 Iniciar Sesión
    </h2>

    <form id="loginForm" class="space-y-4">

      <input type="email" name="correo" placeholder="Correo electrónico" required
      class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"/>

      <input type="password" name="contraseña" placeholder="Contraseña" required
      class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"/>

      <button type="submit"
      class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold transition">
        Ingresar
      </button>

    </form>

    <!-- DIVIDER -->
    <div class="flex items-center my-6">
      <div class="flex-grow border-t"></div>
      <span class="mx-3 text-gray-400">o</span>
      <div class="flex-grow border-t"></div>
    </div>

    <!-- GOOGLE -->
    <button id="googleLogin"
    class="flex items-center justify-center gap-3 w-full border-2 border-gray-300 py-3 rounded-xl hover:bg-gray-100 transition font-semibold">

      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvUEPcQkCb9DNjiN5j_uL51VMehMlc6ye5AQ&s"
      class="w-6 h-6"/>

      Iniciar sesión con Google
    </button>

    <!-- LINKS -->
    <div class="mt-6 text-sm text-gray-600 space-y-2">
      <p><a href="/pages/Login/register.html" class="text-green-600 hover:underline">Crear cuenta</a></p>
      <p><a href="/pages/Login/reset.html" class="text-green-600 hover:underline">¿Olvidaste tu contraseña?</a></p>
    </div>

  </div>

</main>

<!-- ===== SCRIPT MENU ===== -->
<script>
  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");

  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>

</body>
</html>
