<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva Contraseña | PictoVoz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module">
    import { supabase } from '/pages/Login/supabase.js';

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("newPassForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nueva = form.nueva.value.trim();

        const { error } = await supabase.auth.updateUser({
          password: nueva
        });

        if (error) {
          alert("⚠️ " + error.message);
        } else {
          alert("✅ Contraseña actualizada correctamente");
          window.location.href = "/pages/Login/login.html";
        }
      });
    });
  </script>
</head>

<body class="font-sans bg-gradient-to-b from-green-100 to-blue-100 min-h-screen flex flex-col">

<!-- NAVBAR -->
<nav class="flex items-center gap-3 bg-gradient-to-r from-green-500 to-green-400 px-6 py-4 shadow-lg rounded-b-3xl text-white font-bold text-xl">
  
  <img src="/images/pictovoz.png"
  class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-md"/>

  <span>PictoVoz</span>
</nav>

<!-- CONTENIDO -->
<main class="flex flex-1 items-center justify-center px-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-gray-700 mb-6">
      🔐 Nueva contraseña
    </h2>

    <form id="newPassForm" class="space-y-4">

      <input 
        type="password" 
        name="nueva" 
        placeholder="Nueva contraseña" 
        required
        class="w-full px-4 py-3 rounded-xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none"
      />

      <button type="submit"
        class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold transition">
        Actualizar contraseña
      </button>

    </form>

  </div>

</main>

</body>
</html>
