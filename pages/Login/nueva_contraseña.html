<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva Contraseña | PictoVoz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body class="font-sans bg-gradient-to-b from-green-100 to-blue-100 min-h-screen flex flex-col overflow-x-hidden antialiased">

<!-- NAVBAR RESPONSIVE -->
<nav class="bg-gradient-to-r from-green-500 to-green-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50">
  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <div class="flex items-center gap-3 text-white font-bold text-xl">
      <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md"/>
      <span class="text-xl md:text-2xl">PictoVoz</span>
    </div>

    <!-- MENU DESKTOP -->
    <div class="hidden md:flex items-center gap-6 text-white font-bold">
      <a href="/index.html" class="hover:bg-white/20 px-3 py-2 rounded-xl transition">Inicio</a>
      <a href="/pages/Login/login.html" class="hover:bg-white/20 px-3 py-2 rounded-xl transition">Iniciar Sesión</a>
    </div>

    <!-- BOTON MENU MOBILE -->
    <button id="menuBtn" class="md:hidden text-white text-4xl font-bold transition hover:scale-110">
      ☰
    </button>

  </div>

  <!-- MENU MOBILE -->
  <div id="mobileMenu" class="hidden md:hidden flex-col mt-5 gap-4 bg-white/10 backdrop-blur-md rounded-2xl p-4 text-white animate-fade-in text-lg font-bold">
    <a href="/index.html" class="hover:bg-white/20 py-2 rounded-xl transition">Inicio</a>
    <a href="/pages/Login/login.html" class="hover:bg-white/20 py-2 rounded-xl transition">Iniciar Sesión</a>
  </div>
</nav>

<!-- ===== CONTENEDOR CENTRAL DE RESTABLECIMIENTO ===== -->
<main class="flex flex-1 items-center justify-center px-4 py-12">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md border-4 border-green-200 transition hover:shadow-2xl duration-300">

    <h2 class="text-3xl font-extrabold text-gray-700 mb-4 text-center">
      🔐 Nueva Contraseña
    </h2>

    <p class="text-base text-gray-500 mb-6 text-center font-semibold leading-relaxed">
      Estás a un paso de recuperar el acceso. Ingresa tu nueva contraseña para actualizar tu cuenta.
    </p>

    <form id="newPassForm" class="space-y-4">

      <input 
        type="password" 
        name="nueva" 
        placeholder="Escribe tu nueva contraseña" 
        required
        class="w-full px-4 py-3 rounded-2xl border-2 border-green-300 focus:ring-4 focus:ring-green-300 outline-none text-lg font-medium text-gray-700 transition"
      />

      <button type="submit"
        class="w-full bg-gradient-to-r from-green-500 to-green-400 hover:scale-[1.02] text-white py-4 rounded-2xl font-black text-xl shadow-md transition-all mt-2">
        Actualizar contraseña
      </button>

    </form>

  </div>

</main>

<!-- ===== LÓGICA DE CONTROL & SUPABASE ===== -->
<script type="module">
  import { supabase } from '/pages/Login/supabase.js';

  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("newPassForm");
    const menuBtn = document.getElementById("menuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    /* Menú Hamburguesa Toggle */
    menuBtn.onclick = () => {
      mobileMenu.classList.toggle("hidden");
      mobileMenu.classList.toggle("flex");
    };

    /* Envío del Formulario de Actualización */
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nueva = form.nueva.value.trim();

      const { error } = await supabase.auth.updateUser({
        password: nueva
      });

      if (error) {
        alert("⚠️ " + error.message);
      } else {
        alert("✅ Contraseña actualizada correctamente");
        window.location.href = "/pages/Login/login.html";
      }
    });
  });
</script>

</body>
</html>
