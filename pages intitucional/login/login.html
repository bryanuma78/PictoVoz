<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Institucional | PictoVoz</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body class="font-sans bg-gradient-to-b from-blue-100 to-green-100 min-h-screen flex flex-col overflow-x-hidden antialiased">

<!-- NAVBAR RESPONSIVE -->
<nav class="bg-gradient-to-r from-blue-600 to-blue-400 shadow-xl rounded-b-3xl px-4 py-4 sticky top-0 z-50">
  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <div class="flex items-center gap-3 text-white font-bold text-xl">
      <img src="/images/pictovoz.png" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-md" onerror="this.style.display='none'"/>
      <span class="text-xl md:text-2xl">PictoVoz Institucional</span>
    </div>

    <!-- MENU DESKTOP -->
    <div class="hidden md:flex items-center gap-6 text-white font-bold">
      <a href="/index.html" class="hover:bg-white/20 px-3 py-2 rounded-xl transition">Inicio</a>
    </div>

  </div>
</nav>

<!-- ===== CONTENEDOR CENTRAL ===== -->
<main class="flex flex-1 items-center justify-center px-4 py-8 md:py-12">

  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-10 border-4 border-blue-200 animate-fade-in relative overflow-hidden">
    
    <!-- Decoración de fondo sutil -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-50 rounded-full -z-10"></div>

    <div class="flex flex-col items-center">
      <!-- Icono de Institución / Llave -->
      <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 mb-4 shadow-inner">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
        </svg>
      </div>

      <h2 class="text-3xl font-extrabold text-gray-700 mb-2 text-center">Acceso Institucional</h2>
      <p class="text-gray-500 font-medium text-sm text-center mb-8">Ingresa tu número de identificación asignado para acceder a tu panel.</p>
      
      <!-- Formulario de Cédula -->
      <form id="institutionalForm" class="space-y-5 w-full">
        <div>
          <label for="cedula" class="block text-gray-600 font-bold mb-2 text-sm ml-1">Número de Cédula</label>
          <input type="text" id="cedula" name="cedula" placeholder="Ej. 1712345678" required maxlength="10" inputmode="numeric" pattern="[0-9]*"
          class="w-full px-5 py-4 rounded-2xl border-2 border-blue-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none text-xl font-bold tracking-wider text-center text-gray-700 transition placeholder:text-gray-300 placeholder:font-normal placeholder:tracking-normal"/>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-400 hover:scale-[1.02] active:scale-98 text-white py-4 rounded-2xl font-black text-xl shadow-lg shadow-blue-200 transition-all mt-2">
          Verificar e Ingresar
        </button>
      </form>

      <!-- DIVIDER -->
      <div class="flex items-center my-6 w-full">
        <div class="flex-grow border-t-2 border-gray-100"></div>
      </div>

      <!-- BOTÓN VOLVER -->
      <a href="#" id="btnVolver" class="flex items-center justify-center gap-2 text-gray-500 hover:text-blue-600 font-bold transition text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
        Volver al acceso general
      </a>
    </div>

  </div>

</main>

<!-- ===== LÓGICA DE CONTROL & SUPABASE ===== -->
<script type="module">
  import { supabase } from '/pages/Login/supabase.js';

  document.addEventListener("DOMContentLoaded", () => {
    const institutionalForm = document.getElementById("institutionalForm");
    const cedulaInput = document.getElementById("cedula");
    const btnVolver = document.getElementById("btnVolver");

    // Configura el botón volver para regresar a la página anterior en el historial
    btnVolver.onclick = (e) => {
      e.preventDefault();
      window.history.back();
    };

    // Forzar que solo se puedan escribir números en el input
    cedulaInput.addEventListener("input", (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    /* =======================================================
        AUTENTICACIÓN POR CÉDULA Y ENRUTAMIENTO POR ROL
       ======================================================= */
    institutionalForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const cedula = cedulaInput.value.trim();

      if (cedula.length < 10) {
        alert("⚠️ Por favor, ingresa un número de cédula válido (10 dígitos).");
        return;
      }

      // Buscamos al usuario en tu tabla unificada 'personal_institucional'
      const { data: usuario, error } = await supabase
        .from('personal_institucional')
        .select('*')
        .eq('cedula', cedula)
        .single();

      if (error || !usuario) {
        alert("⚠️ No se encontró ningún usuario o institución vinculada a esta cédula.");
        return;
      }

      // Si todo sale bien, guardamos la sesión local en el localStorage
      localStorage.setItem("user_cedula", cedula);
      
      alert(`✅ Acceso correcto. ¡Bienvenido/a ${usuario.nombre}!`);

      /* 🔀 ENRUTAMIENTO SEGÚN EL ROL DETECTADO: */
      switch(usuario.rol) {
        case 'Soporte IT':
          // Redirige al panel local de Soporte IT que creamos
          window.location.href = "/panelcontrol/soporte-it.html"; 
          break;
          
        case 'Docente':
        case 'Estudiante':
          // Profesores y Alumnos van directo al teclado inclusivo de pictogramas
          window.location.href = "/pages/menu/teclado-menu.html";
          break;

        case 'Rectora':
        case 'Encargado Acceso':
          // Puedes mapear aquí sus futuras pantallas cuando las crees
          alert(`Acceso para el rol: ${usuario.rol}. Redirigiendo...`);
          window.location.href = "/pages/menu/teclado-menu.html"; 
          break;

        default:
          window.location.href = "/pages/menu/teclado-menu.html";
      }
    });

  });
</script>

</body>
</html>
